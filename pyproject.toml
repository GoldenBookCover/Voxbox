[project]
name = "voxbox"
version = "1.5.0"
description = "Voxbox - Generating high-fidelity audios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chardet>=7.4.3",
    "faiss-cpu>=1.14.3",
    "fsspec>=2025.3.0",
    "gradio>=6.14.0",
    "librosa<0.11.0",
    "matplotlib>=3.11.0",
    "numpy>=1.24.3,<2.0",
    "omegaconf>=2.3.1",
    "omnivoice>=0.1.5",
    "praat-parselmouth>=0.4.7",
    "pydub>=0.25.1",
    "pyworld>=0.3.5",
    "requests>=2.34.2",
    "resampy>=0.4.3",
    "ruamel-yaml>=0.19.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "soundfile==0.12.1",
    "tensorboard>=2.20.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "tqdm>=4.68.2",
    "transformers>=5.11.0",
    "voxcpm",
    "pydownloader",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu129", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu129", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
pydownloader = { git = "https://github.com/GoldenBookCover/pydownloader.git" }
voxcpm = { git = "https://github.com/GoldenBookCover/VoxCPM.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

